<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESIGN BY SRUJAL - Interactive 3D Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;600&display=swap');

        :root {
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --bg-deep: #050505;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background-color: var(--bg-deep);
            font-family: var(--font-sans);
            color: #ffffff;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3%3Ffilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div class="relative min-h-screen w-full flex flex-col items-center justify-center overflow-hidden bg-[#050505]">
        <!-- Noise & Grain Layer -->
        <div class="noise-overlay"></div>

        <!-- Interactive Background -->
        <div id="canvas-container" class="absolute inset-0 z-0">
            <canvas id="tubes-canvas" class="w-full h-full"></canvas>
        </div>

        <!-- Navigation -->
        <nav class="fixed top-0 left-0 w-full p-8 flex justify-between items-center z-50 pointer-events-none">
            <div class="pointer-events-auto">
                <a href="#" id="brand-logo" class="text-xl font-semibold tracking-widest uppercase font-display hover:opacity-70 transition-opacity">
                    DESIGN BY SRUJAL
                </a>
            </div>
        </nav>

        <!-- Social Floating Sidebar -->
        <div class="fixed right-8 bottom-12 flex flex-col gap-6 z-40 pointer-events-auto">
            <a href="#" id="social-twitter" class="text-white/30 hover:text-white transition-colors">
                <iconify-icon icon="simple-icons:x" class="text-lg"></iconify-icon>
            </a>
            <a href="#" id="social-instagram" class="text-white/30 hover:text-white transition-colors">
                <iconify-icon icon="simple-icons:instagram" class="text-lg"></iconify-icon>
            </a>
            <a href="#" id="social-linkedin" class="text-white/30 hover:text-white transition-colors">
                <iconify-icon icon="simple-icons:linkedin" class="text-lg"></iconify-icon>
            </a>
        </div>
    </div>

    <!-- Scripts for 3D Background -->
    <script type="module">
        const randomColor = () => "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');

        async function initBackground() {
            const canvas = document.getElementById('tubes-canvas');
            if (!canvas) return;

            try {
                const module = await import('https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js');
                const TubesCursor = module.default;

                const app = TubesCursor(canvas, {
                    tubes: {
                        colors: ["#f967fb", "#53bc28", "#6958d5"],
                        s: {
                            intensity: 220,
                            colors: ["#83f36e", "#fe8a2e", "#ff008a", "#60aed5"]
                        }
                    }
                });

                window.addEventListener('click', (e) => {
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    
                    const colors = [randomColor(), randomColor(), randomColor()];
                    const Colors = [randomColor(), randomColor(), randomColor(), randomColor()];
                    
                    app.tubes.setColors(colors);
                    app.tubes.setsColors(Colors);
                });

                window.addEventListener('resize', () => {
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                });

            } catch (err) {
                console.error("Background init failed:", err);
            }
        }

        initBackground();
    </script>
</body>
</html>
